{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h2>Secure Login</h2>
  <form method="post" class="form-grid">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
  </form>
</section>
{% endblock %}
